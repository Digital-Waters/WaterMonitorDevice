# Realtek RTL8821CU (8821cu driver) options for Digital Waters devices.
#
# Install to /etc/modprobe.d/8821cu.conf, then reboot (or reload the module).
#
# rtw_power_mgnt=0  Disable wifi power-saving. With power-save on, the USB
#                   adapter sleeps between beacons: the device still looks
#                   "associated" but is unreachable for inbound SSH and stalls
#                   outbound uploads -- the exact "connected but no internet"
#                   wedge these devices were hitting in the field.
# rtw_ips_mode=0    Disable "inactive power save" (radio powered down when idle),
#                   which causes the same silent stalls.
#
# This is the persistent replacement for the old `iw dev wlan0 set power_save
# off` line in dw_startup.sh, which needed the `iw` package (not installed) and
# only applied until the next driver reload.
options 8821cu rtw_power_mgnt=0 rtw_ips_mode=0
